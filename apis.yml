apis:
- name: Curana Health Interoperability API
  description: >-
    Standards-based FHIR R4 (4.0.1) Patient Access API published for CMS-9115-F / ONC 21st
    Century Cures Act compliance. Lets Medicare Advantage members authorize third-party
    applications via OAuth 2.0 to read their claims, encounter, and clinical data (CARIN
    Blue Button ExplanationOfBenefit, US Core clinical resources) and exposes a public
    provider-directory / plan surface. Read-only GET access over /v1/api with offset/limit
    pagination; responses are FHIR Bundles.
  humanURL: https://curanahealth.com/interoperability-api/
