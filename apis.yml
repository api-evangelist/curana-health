aid: curana-health
name: Curana Health
description: >-
  Curana Health is a value-based senior-living healthcare company delivering on-site
  primary care, behavioral health, palliative care, integrated care management, and
  chronic-condition management to 250,000+ residents across 2,000+ senior living and
  skilled-nursing communities in more than 30 states, supported by 1,400+ providers, a
  national medical group, Accountable Care Organizations (ACOs), and Medicare Advantage
  Special Needs Plans. In support of the CMS Interoperability and Patient Access final rule
  (CMS-9115-F) and the ONC 21st Century Cures Act final rule (45 CFR 170.213 / 170.215),
  Curana Health publishes a standards-based FHIR R4 Interoperability (Patient Access) API at
  fhir.curanahealth.com that lets Medicare Advantage members authorize third-party apps to
  access their claims, encounter, and clinical data using OAuth 2.0, alongside a public
  provider-directory surface.
