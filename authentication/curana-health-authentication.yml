notes: >-
  The Curana Health Interoperability (Patient Access) API uses OAuth 2.0 for member
  authorization, consistent with the CMS-9115-F Patient Access API and ONC 21st Century
  Cures Act requirements. Third-party application owners must register (Sandbox and/or
  Production) via the Patient API Access form before receiving credentials. Access tokens
  carry explicitly-declared scopes that gate which FHIR resources an app may read;
  wildcards are not supported. A member may revoke consent at any time, after which the
  app's token is invalidated (invalid-token responses). The public Provider Directory
  surface is reachable without patient authorization per CMS rules.
